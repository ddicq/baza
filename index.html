<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Фембойчиков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0d0517);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Анимированные частицы на фоне */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(2px 2px at 20% 30%, #fff, transparent),
                radial-gradient(2px 2px at 40% 70%, #b388ff, transparent),
                radial-gradient(2px 2px at 60% 20%, #ff7bda, transparent),
                radial-gradient(2px 2px at 80% 80%, #7c4dff, transparent);
            background-size: 200px 200px;
            animation: stars 40s linear infinite;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes stars {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Главная карточка */
        .glass-card {
            max-width: 820px;
            width: 100%;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 215, 255, 0.05),
                inset 0 0 80px rgba(180, 100, 255, 0.05);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.8s ease-out;
            text-align: center;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Заголовок с мульти-неоном */
        h1 {
            font-size: 3.2rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 0.03em;
            color: #fff;
            text-shadow: 
                0 0 20px rgba(255, 100, 200, 0.6),
                0 0 60px rgba(200, 80, 255, 0.4),
                0 0 120px rgba(124, 77, 255, 0.2);
            margin-bottom: 20px;
            word-break: break-word;
        }

        /* Декоративная линия под заголовком */
        h1::after {
            content: '';
            display: block;
            width: 120px;
            height: 3px;
            margin: 15px auto 0;
            background: linear-gradient(90deg, transparent, #b388ff, #ff7bda, transparent);
            border-radius: 10px;
            animation: linePulse 3s ease-in-out infinite;
        }

        @keyframes linePulse {
            0%, 100% { width: 120px; opacity: 0.6; }
            50% { width: 200px; opacity: 1; }
        }

        /* Описание под заголовком */
        .description {
            font-size: 1.3rem;
            color: #f0e6ff;
            margin: 25px 0 35px;
            line-height: 1.6;
            text-shadow: 0 0 30px rgba(180, 100, 255, 0.2);
        }

        .description .highlight {
            color: #ff7bda;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 100, 200, 0.5);
        }

        .description .free {
            color: #b388ff;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(180, 100, 255, 0.5);
        }

        /* Кнопка Discord */
        .discord-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            max-width: 400px;
            padding: 20px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #5865F2, #7c4dff);
            border: none;
            border-radius: 60px;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 8px 32px rgba(88, 101, 242, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        /* Анимированный градиент кнопки */
        .discord-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.6s;
        }

        .discord-btn:hover::before {
            left: 100%;
        }

        .discord-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 48px rgba(88, 101, 242, 0.6), 0 0 60px rgba(124, 77, 255, 0.2);
        }

        .discord-btn:active {
            transform: scale(0.97);
        }

        .discord-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        /* Адаптив для телефонов */
        @media (max-width: 600px) {
            .glass-card {
                padding: 35px 20px;
                border-radius: 32px;
            }
            h1 {
                font-size: 2.2rem;
            }
            h1::after {
                width: 80px;
            }
            @keyframes linePulse {
                0%, 100% { width: 80px; }
                50% { width: 140px; }
            }
            .description {
                font-size: 1.05rem;
                margin: 20px 0 30px;
            }
            .discord-btn {
                font-size: 1.05rem;
                padding: 16px 24px;
                max-width: 100%;
            }
            .discord-icon {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 400px) {
            .glass-card { padding: 25px 15px; }
            h1 { font-size: 1.8rem; }
            .description { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>БАЗА ФЕМБОЙЧИКОВ</h1>
        
        <div class="description">
            Все <span class="highlight">18+ сливы</span>, арты, видео в нашем Discord сервере.<br>
            <span class="free">БЕСПЛАТНО И БЕЗ ЦЕНЗУРЫ</span>
        </div>

        <a href="https://discord.gg/E3R4QXsmH5" target="_blank" class="discord-btn">
            <span class="discord-icon">💬</span> Перейти в Discord
        </a>
    </div>
</body>
</html>
